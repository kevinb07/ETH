name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    environment: DBT_ETH

    env:
      DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8
      ETH_PAT: ${{ secrets.ETH_PAT }}
      DBT_SNOWFLAKE_IDENTIFIER: ${{ secrets.DBT_SNOWFLAKE_IDENTIFIER }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SCHEMA: pr_${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
            fetch-depth: 0   #needed so we can access main too

      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.12.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.4

      - name: Set up dbt profile + private key
        run: |
          mkdir -p ~/.dbt
          cp .dbt/profiles.yml ~/.dbt/profiles.yml
          echo "$DBT_PRIVATE_KEY" > ~/.dbt/rsa_key.p8
          chmod 600 ~/.dbt/rsa_key.p8

      - name: Install dbt deps
        run: dbt deps

      - name: Run dbt debug
        run: dbt debug --target ci

      # copy manifest.json from main into state folder to use it for defer
      # - name: Create state manifest from main
      #   run: |
      #     git checkout main
      #     dbt deps
      #     dbt parse --target prod
      #     mkdir -p state
      #     cp target/manifest.json state/manifest.json
      #     git checkout -

      - name: Create state manifest from main
        run: |
          # Save the current PR commit
          PR_SHA=$(git rev-parse HEAD)

          # Fetch latest main
          git fetch origin main:refs/remotes/origin/main

          # Switch to main
          git checkout origin/main

          # Install main dependencies
          dbt deps

          # Generate production manifest
          dbt parse --target prod

          # Save manifest
          mkdir -p state
          cp target/manifest.json state/manifest.json

          # Return to PR branch
          git checkout "$PR_SHA"

          # IMPORTANT: Reinstall PR dependencies
          dbt deps

      - name: Verify dbt dependencies
        run: |
          dbt --version
          dbt deps
          ls dbt_packages/

      # --- Clone incrementals first (so is_incremental() is true) ---
      - name: Clone impacted incremental models into PR schema
        run: |
          dbt clone \
            --target ci \
            --state ./state \
            --defer \
            --select "state:modified+,config.materialized:incremental,state:old"

     # --- Then slim build ---
      - name: Slim build (modified + downstream)
        run: |
          dbt build \
            --target ci \
            --state ./state \
            --defer \
            --select "state:modified+" 