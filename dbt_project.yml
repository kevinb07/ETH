
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'eth'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'eth'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

flags:
  fast-fail: true

seeds:
  +database: seeds
  +schema: static

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  eth:
    +materialized: table
    +tags: ['eth', 'crypto']
    marts:
      +tags: 
        - powerbi
        - report
      +schema: marts

      analytics:
        stablecoin_per_day:
          +post-hook:
            - GRANT USAGE ON DATABASE DBT TO ROLE TESTER;
            - GRANT USAGE ON SCHEMA DBT.DBT_KB_MARTS TO ROLE TESTER;
            - GRANT USAGE ON DATABASE DBT TO ROLE BA;
            - GRANT USAGE ON SCHEMA DBT.DBT_KB_MARTS TO ROLE BA;
            - "{{ create_latest_version_view() }}"
          +grants:
            +select: ['BA']


    # Config indicated by + and applies to all files under models/example/
    # example:
    # +materialized: view

vars:
  token_name_var: 'link'
  token_address_var: '0x514910771af9ca656af840dff83e8264ecf986ca'
  token_decimals_var: '18'


dispatch:
  - macro_namespace: dbt_utils
    search_order: ['eth', 'dbt_utils']

