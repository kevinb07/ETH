version: 2

models:
  - name: stg_transactions
    description: transactions in the ethereum blockchain
    columns:
      - name: hash
        description: >
          The hash of the transaction. 
          This is a unique identifier for the transaction.
        data_tests:
          - unique
          - not_null

  - name: stablecoin_per_day
    latest_version: 1
    config:
      contract:
        enforced: true
        alias_types: false
    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: string
        description: ""

      - name: type
        data_type: varchar
        description: ""

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""
    
    versions:

      - v: 1
        # Matches what's above -- nothing more needed
        deprecation_date: 2030-01-01

      - v: 2
        # Remove a column -- this is the breaking change!
        columns:
          # This means: use the 'columns' list above, but exclude token_address and symbol
          - include: all
            exclude: [token_address, symbol]