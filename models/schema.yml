version: 2

models:

  - name: stg_token_transfers
    columns:
      - name: transaction_hash
        data_tests:
          - relationships:
              to: ref('stg_transactions')
              field: hash
  - name: stg_transactions_enriched
    columns:
      - name: value
        data_tests:
          - assert_value_amount_positive:
              field: block_number
  - name: stg_transactions
    description: "{{ doc('transactions') }}"
    columns:
      - name: hash
        description: >
          The hash of the transaction. 
          This is a unique identifier for the transaction.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_token_transfers')
              field: transaction_hash
              severity: warn
              config:
                store_failures: true
                store_failures_as: table
                where: date > current_date - 25 # cost aware wrt to warehouse (run test on subset of data)

  - name: stablecoin_per_day
    latest_version: 1
    config:
      contract:
        enforced: true
        alias_types: false
    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: string
        description: ""

      - name: type
        data_type: varchar
        description: ""
        data_tests:
          - accepted_values:
              values: ['Fiat-backed', 'Hybrid', 'Crypto-backed']

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""
    
    versions:

      - v: 1
        # Matches what's above -- nothing more needed
        deprecation_date: 2030-01-01

      - v: 2
        # Remove a column -- this is the breaking change!
        columns:
          # This means: use the 'columns' list above, but exclude token_address and symbol
          - include: all
            exclude: [token_address, symbol]


unit_tests:
  - name: test_is_valid_transaction_category_breakdown
    model: stg_transactions_enriched
    overrides:
      macros:
        # unit test this model in "full refresh" mode
        is_incremental: false
    given:
      - input: ref('stg_transactions')
        rows:
          - {receipt_contract_address: 'bla' }

      - input: ref('stg_token_transfers')
        rows:
          - {transaction_hash: 'bla'}

      - input: ref('token_transfers_agg')
        rows: 
          - {transaction_hash: 'bla'}
    expect:
      rows:
        - { transaction_category: 'contract_creation' }
