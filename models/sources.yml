version: 2

sources:
  - name: eth
    description: "here is my eth source"
    # quoting: 
    #   database: true
    #   schema: true
    database: eth  
    schema: eth_schema
    freshness: 

      warn_after: {count: 12, period: hour}
      error_after: {count: 365, period: day}
    loaded_at_field: to_timestamp(date) 

    tables:
      - name: contracts
        description: "here is my contracts table"
        freshness: 
          warn_after: {count: 12, period: hour}
          error_after: {count: 40, period: day}
        loaded_at_field: to_timestamp(date) 
        config:
          event_time: date
      - name: contracts_clone
      # - identifier: cnt
      - name: token_transfers
      - name: transactions
        columns:
          - name: hash
            data_tests:
              - unique

  - name: airbnb
    database: airbnb  
    schema: airbnb
    tables:
      - name: apartment_listings